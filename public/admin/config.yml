backend:
  name: git-gateway
  branch: master

site_url: https://lebrunlaboratory.com
display_url: https://lebrunlaboratory.com

media_folder: public/img
public_folder: /img

collections:
  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    filter: { field: "templateKey", value: "news-post" }
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {
          label: "Template Key",
          name: "templateKey",
          widget: "hidden",
          default: "news-post",
        }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "research"
    label: "Research Topics"
    folder: "src/content/research"
    create: true
    slug: "{{slug}}"
    filter: { field: "templateKey", value: "research-post" }
    fields:
      - {
          label: "Template Key",
          name: "templateKey",
          widget: "hidden",
          default: "research-post",
        }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Tags (separate with commas)", name: "tags", widget: "list" }
      - { label: "Header Image", name: "headerImage", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown" }
      - {
          label: "Files",
          name: "files",
          widget: "list",
          fields:
            [
              { label: "File", name: "file", widget: "file" },
              { label: "File Name", name: "name", widget: "string" },
            ],
        }
  # Inner pages open with a typographic header, not a photograph, so only the
  # two places that still render an image offer the field: the Home lead image
  # below, and Header Image on a research topic. Offering it on the other pages
  # only invited what the About page had — the lab logo stretched across a hero
  # band — for a picture the page would never show.
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/home.md"
        label: "Home"
        name: "home"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "home-content",
            }
          - {
              label: "Hidden",
              name: "hidden",
              widget: "hidden",
              default: true,
            }
          - {
              label: "Lead image",
              name: "headerImage",
              widget: "image",
              required: false,
            }
          - {
              label: "Lead image caption",
              name: "headerCaption",
              widget: "string",
              required: false,
            }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/content/pages/about.md"
        label: "About"
        name: "about"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "about-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/content/pages/principal-investigator.md"
        label: "Principal Investigator"
        name: "principal-investigator"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "principal-investigator-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Bio", name: "body", widget: "markdown" }
          - { label: "Headshot", name: "headshot", widget: "image" }
      - file: "src/content/pages/alumni.md"
        label: "Alumni"
        name: "alumni"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "alumni-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/content/pages/team.md"
        label: "Team"
        name: "team"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "team-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - label: "Members"
            name: "members"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Position"
                name: "position"
                widget: "select"
                options:
                  - { label: "Research Associate", value: "associate" }
                  - { label: "Post-Doctorate Fellow", value: "postdoc" }
                  - { label: "Graduate Student", value: "grad" }
                  - { label: "Masters Student", value: "masters" }
                  - { label: "Summer Student", value: "summer" }
                  - { label: "Visiting Scientist", value: "visiting" }
                  - { label: "Research Assistant", value: "assistant" }
                  - { label: "Undergraduate", value: "undergrad" }
                  - { label: "Administration", value: "admin" }
              - label: "Photo"
                name: "photo"
                widget: "image"
              - label: "Description"
                name: "description"
                widget: "markdown"
              - label: "Email"
                name: "email"
                widget: "string"
      - file: "src/content/pages/news.md"
        label: "News List"
        name: "news-page"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "news-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
      - file: "src/content/pages/publications.md"
        label: "Publications"
        name: "publications"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "publications-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/content/pages/protocol.md"
        label: "Protocol"
        name: "protocol"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "protocol-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/content/pages/research.md"
        label: "Research Topic List"
        name: "research-topics"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "research-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
      - file: "src/content/pages/contact.md"
        label: "Contact"
        name: "contact"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "contact-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - {
              label: "Point of contact",
              name: "contact",
              widget: "object",
              fields:
                [
                  { label: "Name", name: "name", widget: "string" },
                  { label: "Position", name: "position", widget: "string" },
                  { label: "Email", name: "email", widget: "string" },
                  { label: "Phone Number", name: "phone", widget: "string" },
                ],
            }
          - {
              label: "Address",
              name: "address",
              widget: "object",
              fields:
                [
                  { label: "Address Line 1", name: "line1", widget: "string" },
                  { label: "Address Line 2", name: "line2", widget: "string" },
                  { label: "City", name: "city", widget: "string" },
                  { label: "Province", name: "province", widget: "string" },
                  {
                    label: "Postal Code",
                    name: "postalCode",
                    widget: "string",
                  },
                ],
            }
          - { label: "Directions", name: "directions", widget: "markdown" }
      - file: "src/content/pages/donate.md"
        label: "Donate"
        name: "donate"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "donate-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/content/pages/links.md"
        label: "Links"
        name: "links"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "links-page",
            }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
